# BlockFace+ · nginx 反向代理样例
# Copyright 2026 Dainsleif · Apache License 2.0
#
# 安装（Debian/Ubuntu 的 sites-available 布局）：
#   sudo install -m 0644 deploy/nginx-blockface-plus.conf /etc/nginx/sites-available/blockface-plus.conf
#   sudo ln -sfn /etc/nginx/sites-available/blockface-plus.conf /etc/nginx/sites-enabled/blockface-plus.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# 它只做三件事：把 api 域名转给回环上的 uvicorn、放大请求体上限、把鉴权头原样带过去。
# HTTPS 见文件末尾那段（certbot 之后把监听改成 443 即可）。
#
# 嫌 certbot 麻烦的话，等价的一份 Caddy 配置在 deploy/caddy-blockface-plus.conf：HTTPS 自动申请、
# 配置更短，但它的默认行为与这里不同（请求体默认没有上限、访问日志默认会把请求头整份记下来），
# 那份文件的注释逐条写清了。两者只需要装一个。

upstream blockface_plus_api {
    server 127.0.0.1:8088;
    # 复用连接：房间加载会一次读几百行头像，每条都新建一次到 uvicorn 的 TCP 连接不值得。
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;          # ← 改成后端的真实域名；没有域名就写服务器 IP

    # 后端的两个上限里，大的是 JSON 请求体（BF_MAX_JSON_BODY_BYTES 默认 67108864 = 64MiB）；
    # 底图那条是 50MiB + 一点 multipart 表单开销。这里取 68m（71303168 字节）：
    # 比后端宽，所以超限的请求会由后端回那一句中文 413，而不是被 nginx 拦在外面换成纯文本。
    # 这是最容易忘的一步：nginx 不放开，请求根本到不了后端，
    # 客户端收到的是 nginx 的纯文本 413，而不是后端那份 {"error": "..."} —— 报错长得不一样，就知道是谁拦的。
    # 调大 BF_MAX_BASE_IMAGE_BYTES / BF_MAX_JSON_BODY_BYTES 时，这里要跟着改。
    client_max_body_size 68m;

    # 大底图上传可以慢，别在传输中途把连接掐了。
    client_body_timeout 300s;

    # 部署时若需要排错，这两行能让你在 access_log 里看到每次请求的耗时与体积。
    # 注意：日志里**不会**出现密码 —— 密码走请求头，nginx 默认不记录请求头；
    # 千万不要为了排错去 log_format 里加 $http_x_bf_room_pwd，那等于把房间密码抄进磁盘。
    access_log /var/log/nginx/blockface-plus.access.log;
    error_log  /var/log/nginx/blockface-plus.error.log;

    location /api/ {
        proxy_pass http://blockface_plus_api;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 清掉 Connection 头才能走上游的 keepalive（不写这行，upstream 里那句 keepalive 等于没写）。
        proxy_set_header Connection        "";

        # 鉴权头透传。nginx 默认会转发客户端带来的未知请求头，所以这一行严格来说不是必须的；
        # 写死在这里有两个现实理由：
        #   1. 以后在中间加一层 CDN / WAF / 另一个代理时，第一个掉的就是这种自定义头，
        #      掉了以后的表现是「密码明明对却一直 401」，且很难一眼定位；
        #   2. 它让这份配置自己就能回答「X-BF-Room-Pwd 到底透传了没有」，不用去翻 nginx 的默认语义。
        # 后端只认请求头里的密码（绝不接受 query 里的），所以这个头是唯一的身份入口。
        proxy_set_header X-BF-Room-Pwd    $http_x_bf_room_pwd;

        # 关键一条：关掉请求缓冲。默认行为是 nginx 先把整个请求体收完（50MiB 底图就落一份临时文件），
        # 收完才连上游；关掉之后字节边到边转发给 uvicorn，省一次磁盘往返，也省掉「nginx 临时目录被塞满」这种故障。
        proxy_request_buffering off;

        # 首帧/大响应超时：批量首刷（几 MB 的 JSON）与取底图（最多 50MiB）都可能超过默认的 60s。
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        send_timeout          300s;

        # 不要把响应缓冲也关掉。GET /api/rooms/{id}/base 最多 50MiB，
        # 保持默认的 proxy_buffering on 能让 nginx 把慢客户端与后端解耦（先落盘再慢慢喂给浏览器），
        # 后端那条连接立刻归还，慢手机不会占着 uvicorn。

        # 底图下载是私有内容（Cache-Control: private, max-age=60 由后端下发），不要在这里加任何缓存层。
    }

    location = / {
        default_type "text/plain; charset=utf-8";
        return 200 "BlockFace+ API\n";
    }

    location / {
        return 404;
    }
}

