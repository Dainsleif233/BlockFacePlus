# ---------------------------------------------------------------------------
# 可选：HTTPS（certbot）
# ---------------------------------------------------------------------------
# 跨域场景下浏览器对「HTTPS 页面请求 http://api」是硬拦的（混合内容），
# 所以只要 Pages 是 https，后端就必须也上 TLS。最省事的路子：
#
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d api.example.com --redirect
#
# certbot 会自己把 80 端口的 server 块改写：加一个 443 ssl server、填好证书路径、
# 再把 80 的请求 301 过去。改完它会 reload nginx，之后 systemctl list-timers | grep certbot
# 能看到自动续期。手工写的话，至少要有这几行：
#
#   listen 443 ssl http2;
#   ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
#   ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
#
# 后端本身不需要任何改动：它只听回环的明文 HTTP，TLS 在 nginx 这一层终止，
# X-Forwarded-Proto 那一行就是告诉后端「对外其实是 https」的。
