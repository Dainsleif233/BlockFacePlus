# BlockFace+ · Caddy 反向代理样例（Caddyfile）
# Copyright 2026 Dainsleif · Apache License 2.0
#
# 安装：
#   sudo install -m 0644 deploy/caddy-blockface-plus.conf /etc/caddy/Caddyfile
#   sudoedit /etc/caddy/Caddyfile                      # 把 api.example.com 与邮箱改成你自己的
#   caddy validate --config /etc/caddy/Caddyfile       # 先验语法，再动线上
#   sudo systemctl reload caddy
#
# 与 nginx 那份（deploy/nginx-blockface-plus.conf）等价，**二者只需装一个**。
# 选 Caddy 通常只图一件事：HTTPS 是它自己去 ACME 申请的 —— 不用装 certbot、不用写证书路径、
# 不用配续期定时器，续期失败还会往上面的邮箱发通知。代价是它的默认值与 nginx 不同，
# 下面几乎每条注释都是「两个反代的默认行为不一样」的地方。
#
# 入口该做的事：把 api 域名转给回环上的 uvicorn、给请求体定一个上限、把鉴权头原样带过去，
# 顺手把 JSON 压一遍、把访问日志里的密码头摘掉。后端的期望见 deploy/blockface-plus.env.example
# 与 docs/deploy-vps.md。
#
# 本文件在 caddy v2.11.7 上验过：caddy validate 通过，且下面每条「实测」都是从
# 127.0.0.1 上真起一个 Caddy、用一个假上游打出来的结果，不是照文档抄的结论。
# 其中两处是改出来的、不是原样就对的，写的时候特意记了下来：末尾同源部署块原来的写法
# 会把 /api 一起 rewrite 到 index.html（见那一段的说明），以及 max_size 的单位问题。
# 装完先 caddy validate 一次 —— 版本不认某个指令时它会直接点名，比等到 reload 失败再猜省事。
{
	# 全局块。邮箱只用于 ACME 通知（证书快到期、申请失败时告诉你），不填也能跑，
	# 但证书出问题时你会是最后一个知道的人。
	email admin@example.com
}

api.example.com {
	# ── 压缩 ────────────────────────────────────────────────────────────────
	# 一次进房要拉整间房的历史（几百行头像 + doc），前端首刷的 JSON 可能有好几 MB；
	# nginx 那份没开 gzip，Caddy 这边补上，省的是用户手机上的流量和等待时间。
	#
	# 默认就已经是对的，不用写 formats：Caddy 默认 zstd + gzip（zstd 优先）。
	# 默认 match 只压文本类 Content-Type（json / javascript / xml / text/* 等），
	# **image/png、image/jpeg、image/webp 都不在里面** —— 所以 50MiB 的底图这条路
	# 不会被拿去压一遍再扔掉（那纯粹是白烧 CPU），它原样直出。
	#
	# 一个容易担心的地方：压缩会不会把后端新加的 ETag / 304 搞坏？
	# 实测（v2.11.7，假上游返回 ETag "abc-123" 且支持 If-None-Match）：
	#   · 客户端不发 Accept-Encoding 时，ETag 原样透传 "abc-123"；
	#   · 客户端发 Accept-Encoding: gzip/zstd 时，Caddy 会把 ETag 改写成
	#     "abc-123-gzip" / "abc-123-zstd" 并加一条 Vary: Accept-Encoding；
	#     浏览器把这个带后缀的值回传，Caddy 会先摘掉后缀再转给上游，
	#     上游看到的仍是 "abc-123"，照样回 304。带后缀和不带后缀两种写法都能命中 304。
	#   · 底图（image/png）压根不进压缩通道，ETag 不变。
	# 所以这一行不影响 IndexedDB 那份按 ETag 回源校验的缓存。
	encode

	# ── 请求体上限 ──────────────────────────────────────────────────────────
	# 后端 BF_MAX_JSON_BODY_BYTES 默认 67108864 字节（64MiB），这里必须 ≥ 它，
	# 否则 Caddy 会在请求到达后端之前先回一个 413 —— 报错长得不一样，就知道是谁拦的。
	#
	# 刻意写「裸字节数」而不是 512MB 这种后缀：nginx 的 m 一定是 1024×1024，没有第二种解释；
	# Caddy 的容量后缀按 1000 还是 1024 进位要看版本，写成裸字节数就不必先去确认这件事，
	# 而且它和后端那几个 BF_*_BYTES 一样都是字节，核对时不用做单位换算。
	# 取值 71303168 = 68MiB：后端的两个上限是 JSON 的 64MiB 与底图的 50MiB，取比它们都宽的那个，
	# 留出 multipart 的 boundary 与表单字段开销 —— 于是超限时回话的是后端那句中文 413。
	# （caddy adapt 出来的 JSON 里就是 "max_size": 71303168，确认没被当成 KB。）
	#
	# Caddy 默认**没有**上限（不是漏配）。但「默认不限」不该当成「就该不限」：
	# 真被人往上传 20GB 时，你希望流量在入口就被掐掉，还是希望它一路流进 uvicorn、
	# 由后端数着字节再拒绝？前者只花入口的带宽，后者花的是你的磁盘和进程内存。
	request_body {
		max_size 71303168
	}

	# ── 业务接口 ────────────────────────────────────────────────────────────
	handle /api/* {
		# 这里**不需要**写任何 header_up：Caddy 的 reverse_proxy 默认转发客户端带来的全部请求头，
		# X-BF-Room-Pwd 会原样到达后端。（nginx 那边同样是默认透传，那份样例写出来是为了自证；
		#  Caddy 这里写一行 header_up X-BF-Room-Pwd {http.request.header.X-BF-Room-Pwd} 反而更绕。）
		#
		# 也**没有** proxy_request_buffering off 的对应项：Caddy 默认就是边收边转，
		# 不会像 nginx 那样先把 50MiB 底图完整落一份临时文件再连上游。少配一条，少一处会忘的地方。
		#
		# 同样**没有** nginx 那三行 300s 超时，因为 Caddy 的默认值是「不超时」而不是 60s：
		#   · 对客户端：write 默认 no timeout，read_body 默认 no timeout
		#     （read_body_idle / write_idle 默认 1m，但每成功读写一次就重置，
		#      所以「慢但一直在传」的 50MiB 上传不会被掐，被掐的只有真的卡住不动的那种 —— 这是好事）；
		#   · 对上游：http transport 的 response_header_timeout / read_timeout / write_timeout 默认全是 no timeout。
		# nginx 那三行是**放宽**它自己 60s 的默认值，Caddy 这边没有要放宽的东西，写了只会把默认的无限制
		# 收窄成 300s。所以这里留空，而不是「照着 nginx 抄一遍表示对齐」。
		#
		# X-Forwarded-For / X-Forwarded-Proto 由 Caddy 自动补上，uvicorn 默认信任回环来的这些头。
		reverse_proxy 127.0.0.1:8088
	}

	# 根路径的探活文案，和 nginx 那份 location = / 对齐：那句 return 200 "BlockFace+ API"。
	# 少了这一段的话，/ 会掉进下面的兜底拿到 404 —— 两份样例就「等价」不起来了，
	# 拿 / 当健康检查的监控会一直报红。
	handle / {
		respond "BlockFace+ API" 200
	}

	# 兜底：未匹配到任何上面的路径。
	handle {
		respond "BlockFace+ API" 404
	}

	# ── 访问日志 ────────────────────────────────────────────────────────────
	# Caddy 默认**不开**访问日志，要开就得自己写这一块。
	#
	# ⚠️ 开之前先看这条：Caddy 的访问日志默认会把**请求头整份**记下来（nginx 默认不记请求头），
	# 而房间密码 X-BF-Room-Pwd 就在请求头里。不做处理直接开日志，等于把密码明文抄进磁盘 ——
	# 这和「从不上传密码到 URL」的那条设计是同一条底线，别在最后一步破了。
	# 下面这个 filter 把 request.headers 整个字段删掉再输出：日志里只留方法、路径、状态码、耗时、体积。
	# （实测：带 X-BF-Room-Pwd 打一次接口，落盘的日志行里既没有 headers 字段、
	#   也搜不到那个头的名字，方法/URI/状态码/耗时都在。）
	#
	# 日志目录要先存在且 caddy 用户可写（官方包用 systemd 的 LogsDirectory=caddy 一般已经建好）：
	#   sudo install -d -o caddy -g caddy -m 0750 /var/log/caddy
	log {
		output file /var/log/caddy/blockface-plus.access.log {
			roll_size 20MiB
			roll_keep 5
		}
		format filter {
			wrap json
			fields {
				request>headers delete
			}
		}
	}
}

# ---------------------------------------------------------------------------
# 可选：同源部署（一个域名同时托管前端静态产物 + 反代 /api）
# ---------------------------------------------------------------------------
# 跨域是要付代价的：多一次 preflight、CSP 要多放行一个来源、密码头要跨域。
# 只有你自己用的话，最省事的是让 Caddy 直接把前端产物 serv 出来、同域转发 /api，
# 此时前端构建**不要**设 VITE_API_BASE_URL（留空 = 同源）。
#
# ⚠️ 这段的结构是有讲究的，别把行挪出 handle：try_files 属于「incoming request manipulation」，
# 按 Caddy 的指令顺序排在 handle 之前。下面这种「root/file_server/try_files 平铺在站点顶层、
# handle /api/* 也写在顶层」的写法看着最自然，实测**会把 API 一起吃掉**：
#
#   blockface.example.com {
#       root * /srv/blockface-plus-web/dist
#       file_server
#       try_files {path} /index.html      # ← 排到 handle 前面去了
#       handle /api/* { reverse_proxy 127.0.0.1:8088 }
#   }
#
#   结果：GET /api/health → 200，返回的是 index.html 的内容。前端拿一坨 HTML 当 JSON 解析，
#   报错还完全指不到 Caddy 头上。把 /api 挪进独立的 handle、静态文件也放进另一个 handle，
#   让 try_files 只在那一个 handle 里生效，才是对的。
#
# 下面这段是实测过的（/api/health 打到上游、/ 与 /some/spa/route 回 index.html、
# /assets/app-abc123.js 长缓存且带 hash 的资源可以 immutable）：
#
# blockface.example.com {
# 	encode
#
# 	request_body {
# 		max_size 71303168
# 	}
#
# 	handle /api/* {
# 		reverse_proxy 127.0.0.1:8088
# 	}
#
# 	handle {
# 		root * /srv/blockface-plus-web/dist
#
# 		# SPA 回退：刷新 /?room=xxx 不能 404（本项目走查询串路由，其实用不到，留着以防以后改路由）。
# 		# try_files 和给 index.html 的那行 header 必须放在同一个 route 里、且 try_files 在前：
# 		# header 按指令顺序本会在 rewrite 之前跑，那时 URI 还是 /some/spa/route，
# 		# 匹配不到 /index.html，于是回退出来的那份 HTML 会一份缓存头都没有（实测过）。
# 		route {
# 			try_files {path} /index.html
# 			header /index.html Cache-Control "no-cache"
# 		}
#
# 		# 带 hash 的构建产物可以长缓存，index.html 必须不缓存，否则用户一直在用旧壳子。
# 		@assets path *.js *.css *.woff2 *.png *.svg *.webp
# 		header @assets Cache-Control "public, immutable, max-age=2592000"
#
# 		file_server
# 	}
# }

# ---------------------------------------------------------------------------
# 可选：没有公网域名时（IP 直连 / 内网域名）
# ---------------------------------------------------------------------------
# 自动 HTTPS 的前提是「域名能解析到这台机器、且 80/443 可达」。这两条不成立时 ACME 会一直重试并失败，
# 站点表现为连不上。两种退路，按需二选一：
#
#   http://203.0.113.10 {        # 前缀 http:// 表示只跑明文，Caddy 不再尝试申请证书
#     ...
#   }
#
#   api.internal {               # 自签一张内部证书：Caddy 自己签，浏览器会警告，适合自用
#     tls internal
#     ...
#   }
#
# 注意跨域场景下混合内容是硬拦的：Pages 是 https，后端就**必须**也是 https。
# 所以 IP + 明文的组合只适用于「前端也同源跑在同一台机器上」的自用场景。
